# @package _global_

Model:
  in_bands: 4
  continue_training: false
  load_checkpoint: false

Generator:
  model_type: esrgan
  block_type: rrdb
  large_kernel_size: 9
  small_kernel_size: 3
  n_channels: 64
  n_blocks: 16
  scaling_factor: 4
  growth_channels: 32
  res_scale: 0.2
  use_icnr: true

Discriminator:
  model_type: esrgan
  n_blocks: 8
  use_spectral_norm: false
  base_channels: 64
  linear_size: 1024
