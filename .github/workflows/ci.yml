# .github/workflows/ci.yml
# manual run:
# pytest -q --maxfail=1 --disable-warnings --cov=opensr_srgan  --cov-report=term-missing --cov-report=xml


name: CI Tests
on:
  # 1) manual run from the Actions tab
  workflow_dispatch:

  # 2) weekly run to catch new dependency releases against supported Python versions
  schedule:
    - cron: "17 3 * * 1"

  # 3) tagged releases (v*)
  # 4) any branch push that changes code/tests/dependency manifests
  push:
    branches:
      - '**'        # allow all branches (needed so branches still trigger)
    tags:
      - 'v*'        # run on tags like v1.2.3
    paths:
      - 'opensr_srgan/**'
      - 'deployment/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e ".[tests]"

      - name: Show dependency versions
        run: |
          python -m pip list
          python -m pip check

      - name: Run tests with coverage
        run: |
          pytest -q --maxfail=1 --disable-warnings \
                 --cov=opensr_srgan \
                 --cov-report=term-missing \
                 --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
